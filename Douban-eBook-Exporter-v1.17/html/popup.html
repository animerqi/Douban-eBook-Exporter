<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Douban eBook Exporter</title>
  <style>
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      width: 230px;
      padding: 12px;
      margin: 0;
    }
    button {
      width: 100%;
      padding: 8px;
      margin: 4px 0;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f5f5f5;
    }
    button:hover:enabled {
      background: #e8e8e8;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
      min-height: 1em;
      word-break: break-all;
    }
  </style>
  <script src="/js/popup.js"></script>
</head>
<body>
  <button id="startButton">start</button>
  <button id="stopButton" disabled>stop</button>
  <div id="status"></div>
</body>
</html>
